eight="4" rx="2" fill="currentColor" opacity=".7"/><rect x="12" y="16" width="6" height="16" rx="2" fill="currentColor"/><rect x="30" y="16" width="6" height="16" rx="2" fill="currentColor"/>'),'var(--c1)']];
const FEHL=['kein Fehler','fett','dünn','Spitze','Ferse'];
const K='golflog.v2';let D=null;
let LT0=0;try{LT0=+localStorage.getItem(K+'.t')||0}catch(e){}
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}

if(!D){D={s:[
{id:'e1',cat:'kurz',title:'Chip auf 8 m',task:'Landepunkt markieren, Ball rollt Richtung Fahne',goal:6,reps:10,club:'SW',dist:8,area:'1,5 m um die Fahne',ex:1},
{id:'e2',cat:'kurz',title:'Bunkerschlag',task:'Sand vor dem Ball treffen, Ball auf dem Grün stoppen',goal:5,reps:10,club:'SW',dist:10,area:'3 m Kreis',ex:1},
{id:'e3',cat:'ann',title:'Wedge-Distanzen 20–40 m',task:'Zufällig zwischen 20, 30 und 40 m wechseln',goal:6,reps:12,club:'LW/SW/GW',dist:30,area:'4 m Kreis',ex:1},
{id:'e4',cat:'trans',title:'7er-Eisen auf 140 m',task:'Volle Routine vor jedem Schlag',goal:6,reps:10,club:'7er-Eisen',dist:140,area:'±10 m, Breite 20 m',ex:1},
{id:'e5',cat:'drive',title:'Fairway-Treffer',task:'Breites Fairway, nur Ziel zählt',goal:6,reps:10,club:'Driver',dist:220,area:'30 m breit',ex:1},

{id:'e7',cat:'putt',title:'Lagenputts 10 m',task:'Ball soll innerhalb 1 m der Fahne enden',goal:5,reps:10,club:'Putter',dist:10,area:'1 m Kreis',ex:1}],
l:[{id:'x1',sid:'e1',d:T(14),hits:3,q:3,f:'dünn',n:'',m:[],ex:1},{id:'x2',sid:'e1',d:T(7),hits:5,q:4,f:'kein Fehler',n:'besserer Rhythmus',m:[],ex:1},{id:'x3',sid:'e1',d:T(1),hits:7,q:4,f:'kein Fehler',n:'',m:[],ex:1},{id:'x4',sid:'e6',d:T(3),hits:6,q:5,f:'kein Fehler',n:'',m:[],ex:1}]};save()}
function save(){const ts=Date.now();try{localStorage.setItem(K,JSON.stringify(D));localStorage.setItem(K+'.t',ts)}catch(e){}cloudSave(ts)}
var cloud=null,cloudT=null,cloudBusy=false,cloudNext=0;
function cloudSave(ts){if(!cloud)return;cloudNext=ts;clearTimeout(cloudT);cloudT=setTimeout(cloudPush,800)}
async function cloudPush(){if(!cloud||cloudBusy)return;cloudBusy=true;const ts=cloudNext;try{await cloud.set({json:JSON.stringify(D),t:ts})}catch(e){toast(e&&e.code==='invalid_argument'?'Cloud-Speicher voll oder nicht erlaubt':'Cloud-Sicherung fehlgeschlagen')}cloudBusy=false;if(cloudNext!==ts)cloudPush()}
async function bak(){const txt=JSON.stringify(D),fn='golf-backup-'+ymd(new Date())+'.json';const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;if(dl){try{await dl.save({filename:fn,data:txt})}catch(e){if(e&&e.code!=='declined')toast('Sichern nicht möglich')}return}
try{const f=new File([txt],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Golf-Backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=fn;document.body.append(a);a.click();a.remove();toast('Backup gespeichert')}catch(e){ex.value=txt;ex.select();toast('Text kopieren und sichern')}}
function impFile(f){if(!f)return;f.text().then(t=>{ex.value=t;imp()}).catch(()=>toast('Datei nicht lesbar'))}
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('golfmedia',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function mput(id,b){const db=await idb();return new Promise((r,j)=>{const t=db.transaction('m','readwrite');t.objectStore('m').put(b,id);t.oncomplete=r;t.onerror=()=>j(t.error)})}
async function mget(id){const db=await idb();return new Promise((r,j)=>{const q=db.transaction('m').objectStore('m').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
const $=id=>document.getElementById(id),V=id=>$(id).value;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,f1=x=>(Math.round(x*10)/10).toString().replace('.',',');

let view='home';

/* ---------- Zeitmessung ---------- */
const p2=n=>String(n).padStart(2,'0'),tmEl=t=>t?(t.acc||0)+(t.t0?Date.now()-t.t0:0):0;
const tmF=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+p2(m):m)+':'+p2(s%60)};
const durF=s=>!s?'':s<60?s+' s':s<3600?Math.round(s/60)+' min':Math.floor(s/3600)+' h '+p2(Math.round(s%3600/60))+' min';

const tmClock=t=>`<b class="tmv"${t&&t.t0?` data-t0="${t.t0}" data-acc="${t.acc||0}"`:''}>${tmF(tmEl(t))}</b>`;

function tmStart(k,cat){const t=D.tm;if(t&&t.k!==k&&(tmEl(t)>0||t.k==='wo')&&!confirm(t.k==='wo'&&D.wo?`Die Trainingseinheit läuft noch (${tmF(tmEl(t))}, ${D.wo.it.length} Übungen). Verwerfen und hier neu starten?`:`Für „${tmName(t.k)}“ läuft schon eine Zeit (${tmF(tmEl(t))}). Verwerfen und hier neu starten?`))return false;if(t&&t.k!==k&&t.k==='wo')D.wo=null;D.tm={k,cat,t0:Date.now(),acc:0};save();render();return true}
function tmPause(){const t=D.tm;if(!t)return;t.acc=tmEl(t);t.t0=null;save();render()}

function tmBox(k,cat,lbl){const t=D.tm&&D.tm.k===k?D.tm:null;if(!t)return `<button class="tmstart" onclick="tmStart('${k}','${cat}')"><b>▶</b>${lbl||'Übung starten'}<small>Zeit läuft mit</small></button>`;

function stats(k){const S=D.s.filter(s=>s.cat===k),L=D.l.filter(l=>S.some(s=>s.id===l.sid));if(k==='fit')return {n:S.length,h:null,q:null,c:D.l.filter(l=>l.fit).length};return {n:S.length,h:L.length?avg(L.map(pct)):null,q:L.length?avg(L.map(l=>l.q)):null,c:L.length}}
