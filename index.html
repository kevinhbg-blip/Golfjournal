try{const f=new File([txt],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Golf-Backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=fn;document.body.append(a);a.click();a.remove();toast('Backup gespeichert')}catch(e){ex.value=txt;ex.select();toast('Text kopieren und sichern')}}

const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('golfmedia',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function mput(id,b){const db=await idb();return new Promise((r,j)=>{const t=db.transaction('m','readwrite');t.objectStore('m').put(b,id);t.oncomplete=r;t.onerror=()=>j(t.error)})}
async function mget(id){const db=await idb();return new Promise((r,j)=>{const q=db.transaction('m').objectStore('m').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}

if(p.step===0)h+=`<p class="sub">Fotografiere die Bälle um die Fahne von der Seite, Handy in ca. 1,4 m Höhe, 3 bis 6 m von der Fahne entfernt, Fahnenfuß und alle Bälle im Bild. Gleiche Höhe und gleicher Abstand machen Serien vergleichbar.</p><label>Foto aufnehmen<input type="file" accept="image/*" capture="environment" onchange="paFile(this.files[0],0)"></label><label>Foto aus der Mediathek<input type="file" accept="image/*" onchange="paFile(this.files[0],0)"></label><label>Video aufnehmen oder wählen<input type="file" accept="video/*" onchange="paFile(this.files[0],1)"></label>`;
else if(p.step==='v')h+=`<video id="pav" src="${p.vurl}" playsinline muted controls preload="auto" style="width:100%;border-radius:12px"></video><label>Bild im Video wählen<input type="range" min="0" max="1000" value="0" oninput="paSeek(this.value)"></label><button class="btn" onclick="paFrame()">Dieses Bild verwenden</button>`;
else{h+='<div class="skw"><canvas id="pac" onclick="paTap(event)"></canvas></div>';
if(p.step===1)h+=`<p class="sub">Tippe auf den Fuß der Fahne (dort, wo sie im Boden steckt).</p><div class="g"><label>Kamerahöhe (m)<input type="number" step="0.05" value="${p.h}" inputmode="decimal" onchange="pa.h=+this.value||1.4;paCamUp()"></label><label>Kamera<select onchange="pa.fz=this.value;paCamUp()"><option value="1"${p.fz==='1'?' selected':''}>1x (Standard)</option><option value="0.5"${p.fz==='0.5'?' selected':''}>0,5x (Weitwinkel)</option><option value="2"${p.fz==='2'?' selected':''}>2x</option></select></label><label class="w">Abstand zur Fahne: <output id="pad">${p.D}</output> m<input type="range" min="2" max="8" step="0.1" value="${p.D}" oninput="$('pad').textContent=this.value;pa.D=+this.value;paCamUp()"></label><div class="w">${paDirSel()}</div></div><p id="pai" class="sub"></p>${p.cam?'<button class="btn" onclick="paGo(2)">Weiter: Bälle erkennen</button>':''}`;
else if(p.step===2)h+=`<div class="g"><label>Ballfarbe<select onchange="pa.col=this.value;paRun()">${Object.entries(PAC).map(([k,v])=>`<option value="${k}"${k===p.col?' selected':''}>${v}</option>`).join('')}</select></label><label>Helligkeit (weiß)<input type="range" min="120" max="250" value="${p.thr}" onchange="pa.thr=+this.value;paRun()"></label><label class="w">Oberen Bildrand ignorieren: <output id="pat">${p.top}</output> %<input type="range" min="0" max="80" value="${p.top}" oninput="$('pat').textContent=this.value" onchange="pa.top=+this.value;paRun()"></label></div><p id="pai" class="sub"></p><p id="paa" class="sub"></p><p class="sub">Antippen: Ball entfernen. Freie Stelle antippen: Ball hinzufügen.</p><button class="btn" onclick="paGo(3)">Weiter: Auswerten</button><button class="btn s" onclick="paGo(1)">Zurück</button>`;
else h+=`<div class="g"><label>Gut bis (m)<input type="number" step="0.5" value="${p.g}" inputmode="decimal" onchange="pa.g=+this.value||2;paDraw();paInfo()"></label><label>Ok bis (m)<input type="number" step="0.5" value="${p.ok}" inputmode="decimal" onchange="pa.ok=+this.value||4;paDraw();paInfo()"></label><label>Schläger<select onchange="pa.club=this.value">${ENT[p.cat].map(x=>`<option${x===p.club?' selected':''}>${x}</option>`).join('')}</select></label><label>Distanz (m)<input type="number" value="${p.dist}" inputmode="decimal" onchange="pa.dist=+this.value||20"></label><div class="w">${paDirSel()}</div></div><p id="pai" class="sub"></p><p id="paa" class="sub"></p><p class="sub">Grün = gut, gelb = ok, rot = schlecht. Die weißen Ellipsen sind die Kreise um die Fahne in Perspektive.</p><button class="btn" onclick="paSave()">Speichern</button><button class="btn s" onclick="paGo(2)">Zurück</button>`}
paShell(h);if(typeof p.step==='number'&&p.step>=1){const c=$('pac');c.width=p.W;c.height=p.H;paDraw();paInfo()}}
async function paSave(){const R=pa.balls.map(paRel).filter(Boolean);if(!R.length)return toast('Keine Bälle markiert');const z=[0,0,0];pa.balls.forEach(b=>z[paZone(b)]++);const d=T(0);
R.forEach(r=>D.sh.push({id:uid(),d,cat:pa.cat,club:pa.club,dist:pa.dist,lat:+r.lat.toFixed(2),dep:+r.dep.toFixed(2),bun:0,ud:0}));
if(pa.sid){const s=D.s.find(x=>x.id===pa.sid),ids=[];try{const bl=await new Promise(r=>$('pac').toBlob(r,'image/jpeg',.85)),id=uid()+uid();await mput(id,bl);ids.push(id+'|i');if(pa.isVid&&pa.file){const v=uid()+uid();await mput(v,pa.file);ids.push(v+'|v')}}catch(e){toast('Foto nicht speicherbar')}
D.l.push({id:uid(),sid:pa.sid,d,hits:Math.min(z[0],s.reps),q:3,f:'kein Fehler',n:`Foto: ${R.length} Bälle, ${z[0]} gut, ${z[1]} ok, ${z[2]} schlecht (gut ≤ ${f1(pa.g)} m)`,m:ids})}
save();paClose();render();toast('Gespeichert: '+R.length+' Bälle')}
if((D.v||0)<4){if(!D.sh.length)seedDash();D.v=4;save()}

let cm=new Date();cm.setDate(1);let cd=T(0);
const MS=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],z=n=>String(n).padStart(2,'0');
const esc=t=>String(t).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function cal(){const y=cm.getFullYear(),m=cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
let cells=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span>${x}</span>`).join('');for(let i=0;i<first;i++)cells+='<span></span>';
for(let d=1;d<=days;d++){const ds=`${y}-${z(m+1)}-${z(d)}`,nl=D.l.filter(l=>l.d===ds).length,np=D.p.filter(p=>p.d===ds).length;
cells+=`<button class="cd${ds===T(0)?' today':''}" aria-pressed="${ds===cd}" aria-label="${d}. ${MS[m]}" onclick="cd='${ds}';render()"><b>${d}</b><i>${'●'.repeat(Math.min(nl,3))}<em>${'○'.repeat(Math.min(np,3))}</em></i></button>`}
const nm=id=>(D.s.find(s=>s.id===id)||{title:'?'}).title,L=D.l.filter(l=>l.d===cd),P=D.p.filter(p=>p.d===cd).sort((a,b)=>a.t<b.t?-1:1);
return `<div class="card" style="--c:var(--c3)"><div class="calh"><button class="chip" aria-label="Voriger Monat" onclick="cm=new Date(${y},${m-1},1);render()">‹</button><h2>${MS[m]} ${y}</h2><button class="chip" aria-label="Nächster Monat" onclick="cm=new Date(${y},${m+1},1);render()">›</button></div><div class="cal">${cells}</div>
<div class="rowx" style="margin-top:8px"><span>● erledigt · ○ geplant</span><button class="chip" onclick="dl(D.p)">Alle Geplanten exportieren</button></div></div>
<div class="card" style="--c:var(--c3)"><h2>${cd.split('-').reverse().join('.')}</h2>
${P.map(p=>{const s=D.s.find(x=>x.id===p.sid);return `<div class="log">⏱ ${p.t} · ${nm(p.sid)} (${p.dur} min)<div class="rowx" style="margin-top:6px;flex-wrap:wrap;justify-content:flex-start"><button class="chip" onclick="go('${s?s.cat:'home'}')">Einheit eintragen</button><button class="chip" onclick="dl([D.p.find(x=>x.id==='${p.id}')])">In Kalender</button><button class="chip" onclick="delP('${p.id}')">Löschen</button></div></div>`}).join('')}
${L.map(l=>{const s=D.s.find(x=>x.id===l.sid)||{reps:10,title:'?'};return l.fit?`<div class="log">● ${s.title}: ${fitSum(l)}</div>`:`<div class="log">● ${s.title}: ${l.hits}/${s.reps} · Kontakt ${l.q}/5</div>`}).join('')}
${P.length+L.length?'':'<p class="rowx">Nichts an diesem Tag.</p>'}
<details><summary>Training einplanen</summary><div class="g"><label class="w">Übung<select id="ps">${CATS.map(c=>`<optgroup label="${c[1]}">${D.s.filter(s=>s.cat===c[0]).map(s=>`<option value="${s.id}">${s.title}</option>`).join('')}</optgroup>`).join('')}</select></label><label>Uhrzeit<input type="time" id="pt" value="18:00"></label><label>Dauer (min)<input type="number" id="pd" value="45" inputmode="numeric"></label></div><button class="btn" style="--c:var(--c3)" onclick="addP()">Einplanen</button></details></div>`}
function addP(){if(!V('ps'))return toast('Erst eine Übung anlegen');D.p.push({id:uid(),sid:V('ps'),d:cd,t:V('pt')||'18:00',dur:+V('pd')||45});save();render();toast('Eingeplant')}
function delP(id){D.p=D.p.filter(p=>p.id!==id);save();render()}
function ics(P){const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',f=d=>`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${z(d.getHours())}${z(d.getMinutes())}00`;
const ev=P.map(p=>{const s=D.s.find(x=>x.id===p.sid);if(!s)return '';const st=new Date(p.d+'T'+p.t),en=new Date(+st+p.dur*6e4);
return ['BEGIN:VEVENT','UID:'+p.id+'@golflog','DTSTAMP:'+now,'DTSTART:'+f(st),'DTEND:'+f(en),'SUMMARY:'+esc('Golf: '+s.title),'DESCRIPTION:'+esc((s.task||'')+' Ziel '+s.goal+' von '+s.reps),'END:VEVENT'].join('\r\n')}).filter(Boolean);
return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Golflog//DE','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n')}
async function dl(P){P=P.filter(Boolean);if(!P.length)return toast('Nichts geplant');const txt=ics(P);
try{const file=new File([txt],'golf-training.ics',{type:'text/calendar'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Golf-Training'});return}}catch(e){if(e&&e.name==='AbortError')return}
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));a.download='golf-training.ics';document.body.append(a);a.click();a.remove();toast('Kalenderdatei erstellt')}catch(e){toast('Export nicht möglich')}}

{id:'e2',cat:'kurz',title:'Bunkerschlag',task:'Sand vor dem Ball treffen, Ball auf dem Grün stoppen',goal:5,reps:10,club:'SW',dist:10,area:'3 m Kreis'},

{id:'e7',cat:'putt',title:'Lagenputts 10 m',task:'Ball soll innerhalb 1 m der Fahne enden',goal:5,reps:10,club:'Putter',dist:10,area:'1 m Kreis'}];

if(D.v<5){for(const ex of FIT_BASE)if(!D.s.some(s=>s.id===ex.id))D.s.push(ex);D.v=5}
unlockAll();
save();

(async()=>{try{const c=window.claude;if(!c||!c.use)return;const[db,u]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!u)return;const id=await u.id();if(!id)return;
const ref=db.doc('data/users/'+id+'/golflog');const s=await ref.get();
if(s.exists){const d=s.data();if(d.json&&(d.t||0)>=LT0){const j=JSON.parse(d.json);if(j&&j.s&&j.l){D=j;for(const ex of BASE_EXERCISES)if(!D.s.some(s=>s.id===ex.id))D.s.push(ex);if((D.v||0)<5){for(const ex of FIT_BASE)if(!D.s.some(s=>s.id===ex.id))D.s.push(ex);D.v=5;setTimeout(save,0)}if(unlockAll())setTimeout(save,0);try{localStorage.setItem(K,d.json);localStorage.setItem(K+'.t',d.t||0)}catch(e){}cloud=ref;render();toast('Daten aus der Cloud geladen');return}}}
cloud=ref;cloudSave(Date.now())}catch(e){}})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
